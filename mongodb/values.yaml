global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/mongodb
  tag: 8.0.13-debian-12-r0

# 3 members, one per node
architecture: replicaset
replicaCount: 3
podAntiAffinityPreset: hard   # never two members on the same node

arbiter:
  enabled: false

auth:
  enabled: true
  rootUser: root
  existingSecret: mongodb-auth   # holds mongodb-root-password + mongodb-replica-set-key


resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits:   { cpu: 500m, memory: 1Gi }

persistence:
  enabled: false


externalAccess:
  enabled: true
  service:
    type: NodePort
    nodePorts: [30017, 30018, 30019]   # mongodb-0, -1, -2
    externalTrafficPolicy: Cluster


volumePermissions:
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r51

metrics:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb-exporter
    tag: 0.47.0-debian-12-r1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 128Mi }

extraDeploy:
  - apiVersion: v1
    kind: Service
    metadata:
      name: mongodb-metrics-external
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/instance: mongodb
        app.kubernetes.io/component: metrics
    spec:
      type: NodePort
      selector:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/instance: mongodb
        app.kubernetes.io/component: mongodb
      ports:
        - name: http-metrics
          port: 9216
          targetPort: metrics
          nodePort: 30216
