
global:
  domain: argocd.34.56.31.129.nip.io

configs:
  params:
    server.insecure: true
  cm:

    exec.enabled: false
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "Served by Traefik on node hostPorts (no load-balancer address)"
      return hs

server:
  ingress:
    enabled: true
    ingressClassName: traefik
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

controller:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }

applicationSet:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }

redis:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }


dex:
  enabled: false
notifications:
  enabled: false
